<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 44">
  <defs>
    <linearGradient id="logo-gold" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#E4C583"/>
      <stop offset="50%" stop-color="#C9A96E"/>
      <stop offset="100%" stop-color="#A87E3A"/>
    </linearGradient>
  </defs>

  <!-- Знак: силуэт крыши, складывающийся в букву B, окно дома внизу -->
  <g fill="none" stroke="url(#logo-gold)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 27 L11 5 L19 27"/>
    <path d="M19 27 C19 15 22 6 29 6 C36 6 38 14 36 20 C34 25 29 27 23 27"/>
    <path d="M3 27 L36 27" stroke-width="1.6"/>
  </g>
  <g fill="url(#logo-gold)">
    <rect x="15" y="31" width="3.4" height="3.4"/>
    <rect x="20.6" y="31" width="3.4" height="3.4"/>
    <rect x="15" y="36" width="3.4" height="3.4"/>
    <rect x="20.6" y="36" width="3.4" height="3.4"/>
  </g>

  <!-- Вордмарк: BUILD золотом, X серебром -->
  <text x="50" y="30"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="24" font-weight="700"
        fill="url(#logo-gold)" letter-spacing="1.5">BUILD</text>
  <text x="146" y="30"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="24" font-weight="700"
        fill="#C4C7C9" letter-spacing="1.5">X</text>
