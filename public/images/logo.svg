<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 48">
  <defs>
    <linearGradient id="gold" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%"   stop-color="#D9B96A"/>
      <stop offset="45%"  stop-color="#C9A96E"/>
      <stop offset="100%" stop-color="#A87E3A"/>
    </linearGradient>
  </defs>

  <!-- Crown (3 peaks above shield) -->
  <path d="M6 14 L8.5 8 L12.5 12 L19 4 L25.5 12 L29.5 8 L32 14"
        stroke="url(#gold)" stroke-width="1.8"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Shield body -->
  <path d="M6 14 L32 14 L32 30 Q32 42 19 47 Q6 42 6 30 Z"
        stroke="url(#gold)" stroke-width="1.8"
        fill="rgba(201,169,110,0.07)" stroke-linejoin="round"/>

  <!-- House: roof -->
  <path d="M12.5 32 L19 25.5 L25.5 32"
        stroke="url(#gold)" stroke-width="1.4"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- House: walls -->
  <rect x="13.5" y="32" width="11" height="9.5"
        stroke="url(#gold)" stroke-width="1.4" fill="none" rx="0.5"/>

  <!-- House: door -->
  <path d="M17.5 41.5 L17.5 37.5 Q17.5 36.5 19 36.5 Q20.5 36.5 20.5 37.5 L20.5 41.5"
        stroke="url(#gold)" stroke-width="1.2" fill="none"/>

  <!-- "PRIME" bold gold -->
  <text x="46" y="33"
        font-family="'Arial Black', 'Arial Bold', Arial, sans-serif"
        font-size="21" font-weight="900"
        fill="url(#gold)" letter-spacing="0.8">PRIME</text>

  <!-- "BUILD" thin dark -->
  <text x="137" y="33"
        font-family="Arial, Helvetica, sans-serif"
        font-size="21" font-weight="300"
        fill="#ffffff" letter-spacing="0.8">BUILD</text>
</svg>
